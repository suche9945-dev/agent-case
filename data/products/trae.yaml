name: TRAE
vendor: bytedance
category: coding
form: 独立 IDE + 桌面应用 + 网页 + 移动 App + VS Code 插件 + JetBrains 插件 + CLI
tagline: 融合 Agent 任务工作台和 IDE 的 AI 开发工具，可完成项目理解、代码修改、命令执行和结果验证。
intro: TRAE 是字节跳动的 AI 开发工具，国内新版整合 Agent 与 IDE 模式，可拆解需求、修改代码、执行命令，并在桌面、网页和移动端跟进任务。它自带套餐国内版分 Lite、Pro、Pro+、Ultra 四档，按每月积分计量，只在调用 TRAE 内置模型时消耗；国际版按用量档位另设。
website: https://www.trae.cn
openSource: false
accessCN: true
accessNote: 国内可用（TRAE CN）；国际版是独立站点，官方未说明账号互通
freeTier: 免费 Free：每月 500 积分，支持 2 个云端任务并发；新用户注册另送 4000 积分
